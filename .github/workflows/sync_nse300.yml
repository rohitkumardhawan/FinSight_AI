name: Sync NSE 300 Daily Quotes & Financials

on:
  schedule:
    # 10:30 UTC = 4:00 PM IST (30 minutes after NSE market close at 3:30 PM IST), Monday through Friday
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

jobs:
  sync-nse300:
    name: Sync NSE 300 Equities & Live Financials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Live NSE Sync Script or Admin Endpoint
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          PYTHONPATH: ./backend
        run: |
          if [ -n "$BACKEND_URL" ] && [ -n "$ADMIN_API_KEY" ]; then
            echo "Triggering remote admin sync endpoint..."
            curl -f -X POST "$BACKEND_URL/api/admin/sync-nse300?batch_size=30" \
              -H "X-Admin-Key: $ADMIN_API_KEY" \
              -H "Content-Type: application/json"
          else
            echo "Running direct Python sync script..."
            python backend/scripts/sync_nse300_live.py --batch-size 30
          fi
