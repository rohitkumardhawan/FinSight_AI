<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Secure Backend Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 680px;
      width: 100%;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      padding: 32px;
    }
    h1 {
      font-size: 24px;
      margin-top: 0;
      color: #0f172a;
    }
    .badge {
      display: inline-block;
      background: #dcfce7;
      color: #15803d;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    .architecture-box {
      background: #f1f5f9;
      border-left: 4px solid #3b82f6;
      padding: 12px 16px;
      border-radius: 4px;
      margin-bottom: 24px;
      font-size: 14px;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }
    select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      background-color: #fff;
    }
    textarea {
      min-height: 90px;
      resize: vertical;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .meta-tag {
      display: inline-block;
      font-size: 12px;
      color: #64748b;
      margin-top: 8px;
    }
    .output-box {
      margin-top: 12px;
      padding: 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      min-height: 60px;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">Security Verified</span>
    <h1>Gemini Secure API Client</h1>

    <div class="architecture-box">
      <strong>Zero Key Exposure Architecture:</strong><br>
      • Browser &rarr; <code>POST /api/generate</code> (Backend Server)<br>
      • Backend Server &rarr; Google Gemini API (using secret <code>.env</code> key)<br>
      <em>The browser client never sees or stores your Gemini API key!</em>
    </div>

    <div class="form-group">
      <label for="modelSelect">Select Model / Thinking Mode:</label>
      <select id="modelSelect">
        <option value="gemini-4-neon">Gemini 4 Neon (High Thinking - Pay-as-you-go Tier)</option>
        <option value="gemini-3.8-flash">Gemini 3.8 Flash (High Reasoning)</option>
        <option value="gemini-3.5-flash-lite" selected>Gemini 3.5 Flash Lite (Fast & Recommended for Free Tier)</option>
        <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash Lite</option>
      </select>
    </div>

    <div class="form-group">
      <label for="prompt">Prompt:</label>
      <textarea id="prompt" placeholder="Enter your prompt here...">Explain what makes a secure backend API in two sentences.</textarea>
    </div>

    <button id="sendBtn" onclick="sendPrompt()">Send Request to Backend</button>

    <div class="form-group" style="margin-top: 24px;">
      <label>Response from Backend:</label>
      <span id="modelTag" class="meta-tag"></span>
      <div id="output" class="output-box">Gemini response will appear here...</div>
    </div>
  </div>

  <script>
    async function sendPrompt() {
      const promptInput = document.getElementById('prompt');
      const modelSelect = document.getElementById('modelSelect');
      const output = document.getElementById('output');
      const modelTag = document.getElementById('modelTag');
      const sendBtn = document.getElementById('sendBtn');
      const prompt = promptInput.value.trim();
      const model = modelSelect.value;

      if (!prompt) return;

      sendBtn.disabled = true;
      modelTag.textContent = '';
      output.textContent = 'Contacting backend server with model ' + model + '...';

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, model })
        });

        const data = await response.json();

        if (data.success) {
          modelTag.textContent = 'Generated by: ' + (data.model || model);
          output.textContent = data.result;
        } else {
          modelTag.textContent = '';
          output.textContent = 'Error: ' + data.error;
        }
      } catch (err) {
        output.textContent = 'Network error contacting backend: ' + err.message;
      } finally {
        sendBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
